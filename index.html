<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>PROXY SERVER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #05040a;
      --surface: #0e0a16;
      --glass: rgba(14, 10, 22, 0.78);
      --line: rgba(168, 85, 247, 0.12);
      --primary: #a855f7;
      --secondary: #ff9a1a;
      --tertiary: #22d3ee;
      --gold: #ffe066;
      --text: #f3f0ff;
      --muted: #8a7a9e;
      --font: 'Outfit', sans-serif;
      --mono: 'Space Mono', monospace;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(168, 85, 247, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 90% 20%, rgba(255, 154, 26, 0.1), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(34, 211, 238, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dots {
      display: flex;
      gap: 4px;
    }

    .brand-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .brand-dots span:nth-child(1) { background: #ff9a1a; }
    .brand-dots span:nth-child(2) { background: #a855f7; }
    .brand-dots span:nth-child(3) { background: #22d3ee; }
    .brand-dots span:nth-child(4) { background: #ffe066; }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--primary);
      padding: 6px 12px;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.1);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .ticker-wrap {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 0;
    }

    .ticker-track {
      display: flex;
      gap: 32px;
      white-space: nowrap;
      animation: scroll 28s linear infinite;
      font-size: 12px;
      color: var(--muted);
    }

    .ticker-track span.highlight {
      color: var(--secondary);
      font-weight: 600;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 14px 12px;
    }

    @media (min-width: 768px) {
      .page { padding: 24px 16px 40px; }
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .section-tag::before {
      content: '';
      width: 18px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      align-items: start;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    @media (min-width: 768px) {
      .split {
        grid-template-columns: 1.15fr 0.85fr;
        gap: 28px;
        align-items: start;
      }

      .right-col { gap: 16px; }

      .section-tag {
        font-size: 11px;
        margin-bottom: 14px;
      }
    }

    .video-panel { position: relative; }

    .video-frame {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.1),
        0 12px 40px rgba(0, 0, 0, 0.5),
        0 0 60px rgba(168, 85, 247, 0.1);
    }

    @media (min-width: 768px) {
      .video-frame {
        border-radius: 20px;
        box-shadow:
          0 0 0 1px rgba(168, 85, 247, 0.1),
          0 20px 60px rgba(0, 0, 0, 0.6),
          0 0 80px rgba(168, 85, 247, 0.12);
      }
    }

    .video-frame::before,
    .video-frame::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--primary);
      z-index: 2;
      pointer-events: none;
      opacity: 0.7;
    }

    .video-frame::before {
      top: 12px;
      left: 12px;
      border-right: none;
      border-bottom: none;
      border-radius: 4px 0 0 0;
    }

    .video-frame::after {
      bottom: 12px;
      right: 12px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 4px 0;
    }

    .video-frame video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000;
    }

    .video-label {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(229, 57, 53, 0.45);
      color: #ff4444;
    }

    .video-label .live-dot-label {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4444;
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 0 6px #ff4444;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .step-bridge {
      text-align: center;
      padding: 14px 0 12px;
    }

    .bridge-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 20%, var(--secondary) 70%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .bridge-sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .install-stat {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .install-stat strong {
      color: var(--primary);
      font-weight: 700;
    }

    .install-wrap {
      max-width: 360px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .step-bridge { padding: 8px 0 4px; }
      .bridge-title { font-size: 20px; }
      .bridge-sub { font-size: 12px; margin-bottom: 12px; }
    }

    .live-chat {
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
    }

    @media (min-width: 768px) {
      .live-chat {
        margin-top: 28px;
        padding: 20px;
        border-radius: 20px;
      }
    }

    .live-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .live-chat-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .live-dot-chat {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .comment-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .comments-scroll {
      height: 220px;
      min-height: 220px;
      max-height: 220px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      padding-right: 0;
      padding-bottom: 4px;
      scroll-behavior: auto;
    }

    .scroll-hint { display: none; }

    @media (max-width: 767px) {
      .scroll-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--muted);
        opacity: 0.85;
        animation: hintBounce 2s ease-in-out infinite;
      }

      .scroll-hint svg {
        width: 12px;
        height: 12px;
        fill: var(--muted);
      }

      @keyframes hintBounce {
        0%, 100% { transform: translateY(0); opacity: 0.7; }
        50% { transform: translateY(3px); opacity: 1; }
      }
    }

    .comments-scroll::-webkit-scrollbar { width: 3px; }

    .comments-scroll::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.35);
      border-radius: 3px;
    }

    .comment {
      display: flex;
      gap: 10px;
      animation: commentPop 0.25s ease;
    }

    @keyframes commentPop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .comment-body {
      flex: 1;
      min-width: 0;
    }

    .comment-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 3px;
    }

    .comment-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .comment-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .comment-text {
      font-size: 12px;
      color: #c4b8d9;
      line-height: 1.4;
      word-break: break-word;
    }

    .typing-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 2px;
      min-height: 28px;
    }

    .typing-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: typeDot 1s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typeDot {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .typing-bar.hidden { display: none; }

    .video-caption,
    .video-sub { display: none; }

    .offer-card {
      position: relative;
      padding: 14px;
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .offer-card {
        padding: 24px;
        border-radius: 24px;
      }
    }

    .offer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary), var(--primary), var(--tertiary));
    }

    .offer-card::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2), transparent 70%);
      pointer-events: none;
    }

    .icon-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 0;
    }

    .offer-card-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .offer-card-body {
      flex: 1;
      min-width: 0;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(34, 211, 238, 0.45);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35), 0 0 24px rgba(34, 211, 238, 0.15);
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .icon-wrap { margin-bottom: 18px; }

      .offer-card-inner { display: block; }

      .app-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4), 0 0 36px rgba(34, 211, 238, 0.18);
      }
    }

    .tag-row {
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    @media (min-width: 768px) {
      .tag-row {
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
      }
    }

    .tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .tag-hot {
      background: rgba(255, 154, 26, 0.15);
      color: var(--secondary);
      border: 1px solid rgba(255, 154, 26, 0.4);
    }

    .tag-pro {
      background: rgba(168, 85, 247, 0.16);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .offer-title {
      text-align: left;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .offer-desc {
      text-align: left;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
      margin-bottom: 0;
    }

    .rating {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      margin-top: 4px;
      margin-bottom: 0;
      font-size: 12px;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .offer-title {
        text-align: center;
        font-size: 22px;
        margin-bottom: 6px;
      }

      .offer-desc {
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 18px;
      }

      .rating {
        justify-content: center;
        margin-top: 0;
        margin-bottom: 18px;
        font-size: 14px;
      }
    }

    .rating .stars {
      color: var(--gold);
      letter-spacing: 2px;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
      margin-bottom: 0;
    }

    @media (min-width: 768px) {
      .chips {
        gap: 8px;
        margin-top: 0;
        margin-bottom: 20px;
      }
    }

    .chip {
      text-align: center;
      padding: 7px 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
    }

    .chip strong {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1px;
    }

    .chip span {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    @media (min-width: 768px) {
      .chip { padding: 10px 6px; border-radius: 12px; }
      .chip strong { font-size: 13px; margin-bottom: 2px; }
      .chip span { font-size: 10px; }
    }

    .install-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 0.7em 1.4em 0.7em 1.1em;
      border: none;
      border-radius: 20em;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: white;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(0deg, rgba(20, 167, 62, 1) 0%, rgba(102, 247, 113, 1) 100%);
      box-shadow: 0 0.7em 1.5em -0.5em #14a73e98;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .install-btn:hover {
      box-shadow: 0 0.5em 1.5em -0.5em #14a73e98;
      transform: translateY(-1px);
    }

    .install-btn:active {
      box-shadow: 0 0.3em 1em -0.5em #14a73e98;
      transform: scale(0.98);
    }

    .install-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
      margin-right: 6px;
    }

    .trust-row { display: none; }

    @media (min-width: 768px) {
      .trust-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .trust-item svg {
      width: 16px;
      height: 16px;
      fill: var(--primary);
      opacity: 0.8;
    }

    .trust-item strong { color: var(--text); }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 8px 16px 10px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    @media (min-width: 768px) {
      footer {
        padding: 20px 16px 16px;
        font-size: 11px;
      }
    }

    @media (max-width: 767px) {
      header { padding: 10px 14px; }
      .brand h1 { font-size: 13px; }
      .live-badge { font-size: 9px; padding: 5px 10px; }
      .ticker-wrap { padding: 6px 0; }
      .ticker-track { font-size: 11px; }

      .page {
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 96px);
        padding-bottom: 0;
      }

      .split { flex: 1 1 auto; }
      .step-bridge { padding: 10px 0 8px; }
      .bridge-sub { margin-bottom: 8px; }
      .install-stat { margin-bottom: 8px; }

      .offer-panel .section-tag {
        margin-top: 8px;
        margin-bottom: 6px;
      }

      .offer-card { padding: 12px; }
